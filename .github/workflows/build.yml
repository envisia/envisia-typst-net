name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Package version. Empty builds the csproj version with a CI suffix.
        type: string
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    # manylinux_2_28 builds against glibc 2.28, so the .so also loads on older distributions than the runner's.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            library: libenvisia_typst.so
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
            library: libenvisia_typst.so
          - rid: osx-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            library: libenvisia_typst.dylib
          - rid: osx-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            library: libenvisia_typst.dylib
          - rid: win-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            library: envisia_typst.dll
          - rid: win-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            library: envisia_typst.dll
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/Envisia.Typst/native
          key: ${{ matrix.rid }}

      - name: Build
        working-directory: src/Envisia.Typst/native
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage
        run: |
          mkdir -p "staging/${{ matrix.rid }}"
          cp "src/Envisia.Typst/native/target/${{ matrix.target }}/release/${{ matrix.library }}" "staging/${{ matrix.rid }}/"
          ls -l "staging/${{ matrix.rid }}"

      - name: Show required glibc
        if: runner.os == 'Linux'
        run: objdump -T "staging/${{ matrix.rid }}/${{ matrix.library }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: staging/
          if-no-files-found: error
          retention-days: 7

  notices:
    name: Third-party notices
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-about
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-about@0.9.2

      - name: Check THIRD-PARTY-NOTICES.md
        working-directory: src/Envisia.Typst/native
        run: |
          cargo about generate --locked -c about.toml about.hbs -o ../../../THIRD-PARTY-NOTICES.md
          git diff --exit-code -- ../../../THIRD-PARTY-NOTICES.md || {
            echo "::error::THIRD-PARTY-NOTICES.md is out of date, regenerate it with the command above"
            exit 1
          }

  pack:
    name: Pack
    needs: [native, notices]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Download native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: runtimes

      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            prefix=$(dotnet msbuild src/Envisia.Typst/Envisia.Typst.csproj -getProperty:VersionPrefix)
            VERSION="$prefix-ci.${{ github.run_number }}.${{ github.run_attempt }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packing $VERSION"

      - name: Pack
        run: >
          dotnet pack src/Envisia.Typst/Envisia.Typst.csproj
          --configuration Release
          --output packages
          -p:Version=${{ steps.version.outputs.version }}
          -p:EnvisiaTypstRuntimesDirectory=${{ github.workspace }}/runtimes/

      - name: List package
        run: unzip -l packages/*.nupkg

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.rid }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Check runtime
        run: |
          rid=$(dotnet --info | tr -d '\r' | sed -n 's/^ *RID: *//p' | head -1)
          echo "dotnet runs as $rid"
          [ "$rid" = "${{ matrix.rid }}" ]

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: packages

      # The tests reference the package instead of the project, so each platform loads its library from the package's
      # runtimes/<rid>/native folder exactly as a consumer would.
      - name: Test
        run: >
          dotnet test --project tests/Envisia.Typst.Tests
          --configuration Release
          -p:EnvisiaTypstPackageVersion=${{ needs.pack.outputs.version }}
          -p:RestoreAdditionalProjectSources="${{ github.workspace }}/packages"
          --report-trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults
          retention-days: 7
